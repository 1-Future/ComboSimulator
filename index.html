<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fancy Combo Trainer</title>
  <style>
    body {
      background-color: #121212;
      color: #fff;
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      height: 100vh;
      margin: 0;
      padding: 10px;
    }
    #container {
      width: 800px;
      background-color: #222;
      border-radius: 12px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.3);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    #video {
      width: 100%;
      aspect-ratio: 16 / 9;
      background-color: #111;
      display: block;
    }
    #comboBar {
      position: relative;
      height: 48px;
      background-color: #444;
      cursor: pointer;
      overflow: hidden;
      padding: 0 12px;
      box-sizing: border-box;
      flex-shrink: 0;
    }
    .comboMarker {
      position: absolute;
      height: 100%;
      width: 4px;
      background-color: #0af;
      cursor: pointer;
    }
    .comboLabel {
      position: absolute;
      bottom: 2px;
      transform: translateX(-50%);
      background-color: #000;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid #fff;
      font-weight: bold;
      font-size: 12px;
      color: #fff;
      text-shadow: 0 0 3px #000, 0 0 6px #00f;
      white-space: nowrap;
      pointer-events: auto;
    }
    #currentMarker {
      position: absolute;
      height: 100%;
      width: 2px;
      background-color: #ff0;
      cursor: ew-resize;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      padding: 8px;
      justify-content: center;
      align-items: center;
      background: #111;
      flex-shrink: 0;
    }
    button, input[type=file] {
      background-color: #333;
      border: none;
      color: #fff;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background-color: #555;
    }
    .grade-feedback {
      text-align: center;
      margin-top: 10px;
    }
    #comboLog {
      font-size: 12px;
      white-space: pre-wrap;
      margin-top: 8px;
      max-height: 120px;
      overflow-y: auto;
      background: #1a1a1a;
      border: 1px solid #444;
      padding: 6px;
      width: 100%;
      box-sizing: border-box;
      flex-shrink: 0;
    }
    #clickOverlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .clickBox {
      position: absolute;
      border: 2px solid red;
      background: rgba(255, 0, 0, 0.3);
      pointer-events: auto;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="container">
    <video id="video" controls autoplay muted playsinline></video>
    <div id="clickOverlay" style="z-index: 2;"></div>
    <div id="comboBar" style="z-index: 3;">
      <div id="currentMarker"></div>
    </div>
    <div class="controls">
      <button onclick="resizeApp(-1)">-</button>
      <button onclick="resizeApp(1)">+</button>
      <button onclick="toggleFullScreen()">Fullscreen</button>
      <input type="file" id="fileInput">
      <button id="resetBtn">Assign Reset Key</button>
      <button onclick="toggleEditMode()" id="editToggle">Edit Combo: ON</button>
      <button onclick="toggleLog()" id="toggleLogBtn">Hide Log</button>
      <button onclick="saveCombo()">Save JSON</button>
      <input type="file" id="loadComboInput" onchange="loadCombo()" style="display:none;">
      <button onclick="document.getElementById('loadComboInput').click()">Load JSON</button>
      <button onclick="clearCombo()">Clear JSON</button>
    </div>
    <div class="grade-feedback" id="feedback"></div>
    <div id="comboLog"></div>
  </div>

<script>
const video = document.getElementById('video');
const fileInput = document.getElementById('fileInput');
const comboBar = document.getElementById('comboBar');
const editToggle = document.getElementById('editToggle');
const resetBtn = document.getElementById('resetBtn');
const feedback = document.getElementById('feedback');
const comboLog = document.getElementById('comboLog');
let currentMarker = document.getElementById('currentMarker');
currentMarker.addEventListener('mousedown', () => {
  isDragging = true;
  document.body.style.userSelect = 'none';
});
document.addEventListener('mouseup', () => {
  isDragging = false;
  document.body.style.userSelect = '';
});
document.addEventListener('mousemove', (e) => {
  if (isDragging && video.duration) {
    const rect = comboBar.getBoundingClientRect();
    const percent = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    video.currentTime = percent * video.duration;
  }
});
let isDragging = false;
let comboSteps = [];
let editMode = true;
let resetKey = null;
let comboStartTime = null;
let currentStep = 0;

fileInput.addEventListener('change', () => {
  const file = fileInput.files[0];
  if (file) {
    const url = URL.createObjectURL(file);
    video.src = url;
    video.load();
  }
});

function toggleEditMode() {
  editMode = !editMode;
  editToggle.textContent = `Edit Combo: ${editMode ? 'ON' : 'OFF'}`;
  renderMarkers();
}

function renderMarkers() {
  comboBar.innerHTML = '';
  comboBar.onclick = (e) => {
    const rect = comboBar.getBoundingClientRect();
    const percent = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    video.currentTime = percent * video.duration;
  };
  const newMarker = document.createElement('div');
  newMarker.id = 'currentMarker';
  newMarker.style.position = 'absolute';
  newMarker.style.height = '100%';
  newMarker.style.width = '2px';
  newMarker.style.backgroundColor = '#ff0';
  newMarker.style.cursor = 'ew-resize';
  comboBar.appendChild(newMarker);
  currentMarker = newMarker;
  currentMarker = document.getElementById('currentMarker');
  currentMarker.style.cursor = 'ew-resize';
  currentMarker.addEventListener('mousedown', () => {
    isDragging = true;
    document.body.style.userSelect = 'none';
  });

  comboSteps.forEach((step, index) => {
    const marker = document.createElement('div');
    marker.classList.add('comboMarker');
    marker.style.left = (step.time / video.duration * 100) + '%';
    const label = document.createElement('div');
    label.className = 'comboLabel';
    label.style.left = (step.time / video.duration * 100) + '%';
    label.textContent = step.key;
    if (editMode) {
      label.oncontextmenu = (e) => {
        e.preventDefault();
        comboSteps.splice(index, 1);
        renderMarkers();
      };
    }
    comboBar.appendChild(marker);
    comboBar.appendChild(label);
  });
}

resetBtn.addEventListener('click', e => {
  if (editMode) toggleEditMode();
  const label = document.createElement('label');
  label.textContent = 'Assign Reset Key:';
  const input = document.createElement('input');
  input.type = 'text';
  input.maxLength = 1;
  input.style.marginLeft = '8px';
  input.addEventListener('input', () => {
    const key = input.value.toLowerCase();
    if (key) {
      resetKey = key;
      resetBtn.textContent = `Reset (${key.toUpperCase()})`;
      document.body.removeChild(wrapper);
    }
  });
  const wrapper = document.createElement('div');
  wrapper.style.position = 'absolute';
  wrapper.style.top = (e.clientY + 5) + 'px';
  wrapper.style.left = (e.clientX + 5) + 'px';
  wrapper.style.background = '#222';
  wrapper.style.border = '1px solid #555';
  wrapper.style.padding = '6px';
  wrapper.style.borderRadius = '4px';
  wrapper.style.zIndex = 1000;
  wrapper.appendChild(label);
  wrapper.appendChild(input);
  document.body.appendChild(wrapper);
  input.focus();
});

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft') {
    e.preventDefault();
    video.currentTime = Math.max(0, video.currentTime - 1 / 30);
    return;
  }
  if (e.key === 'ArrowRight') {
    e.preventDefault();
    video.currentTime = Math.min(video.duration, video.currentTime + 1 / 30);
    return;
  }
  const key = e.key.toLowerCase();
  if (resetKey && key === resetKey) {
    video.pause();
    currentStep = 0;
    comboStartTime = null;
    feedback.innerText = 'Combo reset.';
    comboLog.innerText = '';
    if (comboSteps.length) {
      video.currentTime = comboSteps[0].time;
    }
    return;
  }

  const upperKey = e.key.toUpperCase();
  if (editMode && video.duration) {
    const time = video.currentTime;
    comboSteps.push({ key: upperKey, time });
    comboSteps.sort((a, b) => a.time - b.time);
    renderMarkers();
    return;
  }

  if (!editMode && comboSteps[currentStep] && upperKey === comboSteps[currentStep].key) {
    const now = performance.now();
    if (!comboStartTime) {
      comboStartTime = now;
      video.currentTime = comboSteps[0].time;
      video.play();
    }
    const expected = (comboSteps[currentStep].time - comboSteps[0].time) * 1000;
    const actual = now - comboStartTime;
    const offset = actual - expected;
    const grade = Math.abs(offset) <= 50 ? 'Perfect' : Math.abs(offset) <= 150 ? 'Good' : 'Miss';
    const log = `Step ${currentStep + 1}: ${comboSteps[currentStep].key} → ${grade} (${offset.toFixed(0)}ms)`;
    feedback.innerText = log;
    comboLog.innerText += log + '\n';
    currentStep++;
    if (currentStep >= comboSteps.length) {
      feedback.innerText += ' - Combo Completed!';
      comboLog.innerText += 'Combo Completed!\n';
    }
  }
});

function updateMarker() {
  if (video.duration && currentMarker && !isDragging) {
    const percent = video.currentTime / video.duration;
    currentMarker.style.left = (percent * 100) + '%';
  }
  requestAnimationFrame(updateMarker);
}
updateMarker();

function resizeApp(direction) {
  const container = document.getElementById('container');
  const step = 100;
  const width = container.offsetWidth + step * direction;
  container.style.width = `${width}px`;
}

function toggleFullScreen() {
  const container = document.getElementById('container');
  if (!document.fullscreenElement) {
    container.requestFullscreen().catch(err => console.error(err));
  } else {
    document.exitFullscreen();
  }
}

function toggleLog() {
  const isHidden = comboLog.style.display === 'none';
  comboLog.style.display = isHidden ? 'block' : 'none';
  document.getElementById('toggleLogBtn').textContent = isHidden ? 'Hide Log' : 'Show Log';
}

function saveCombo() {
  const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(comboSteps, null, 2));
  const dlAnchor = document.createElement('a');
  dlAnchor.setAttribute("href", dataStr);
  dlAnchor.setAttribute("download", "combo.json");
  dlAnchor.click();
}

function loadCombo() {
  const input = document.getElementById('loadComboInput');
  const file = input.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (Array.isArray(data)) {
        comboSteps = data;
        renderMarkers();
      } else {
        alert('Invalid combo file');
      }
    } catch (err) {
      alert('Error loading combo file');
    }
  };
  reader.readAsText(file);
}

function clearCombo() {
  comboSteps = [];
  renderMarkers();
  feedback.innerText = '';
  comboLog.innerText = '';
  currentStep = 0;
  comboStartTime = null;
}
</script>
</body>
</html>
